name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Release gate (lint + Linux test)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install Linux system libs (for node-hid)
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Install deps
        run: npm ci
      - name: Build DAPjs
        run: npm run build:dapjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck (TypeScript 7)
        run: npm run typecheck
      - name: Validate target JSON files
        run: npm run lint:targets
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Webpack build
        run: npm run compile
      - name: Run extension tests
        run: xvfb-run -a npm test

  build:
    name: Build VSIX (${{ matrix.target }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        # VSIX artifacts are built on the oldest supported runner images so
        # the bundled native bindings keep loading there (glibc / macOS floor).
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-24.04
            target: linux-armhf
            cross: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Set up QEMU (cross-build)
        if: matrix.cross
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Install Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Install deps
        run: npm ci
      - name: Build DAPjs
        run: npm run build:dapjs
      - name: Verify node-hid native binding
        if: '!matrix.cross'
        shell: bash
        run: |
          node -e "const h=require('node-hid'); console.log('node-hid loaded, HID devices count=', h.devices().length)"
      - name: Webpack build
        run: npm run compile
      - name: Install locked packaging tools
        run: npm ci --ignore-scripts --prefix .github/publish-tools
      - name: Package VSIX (${{ matrix.target }})
        shell: bash
        run: .github/publish-tools/node_modules/.bin/vsce package --target ${{ matrix.target }} --ignoreFile .vscodeignore-${{ matrix.target }} --out freeocd-extension-${{ matrix.target }}.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: freeocd-extension-${{ matrix.target }}.vsix

  publish:
    name: Publish (Marketplace + Open VSX + GitHub Releases)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install locked publishers
        run: npm ci --ignore-scripts --prefix .github/publish-tools
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
      - name: List VSIX files
        run: ls -la vsix
      - name: Publish to VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.AZURE_PAT }}
        run: |
          failed=0
          for file in vsix/*.vsix; do
            echo "Publishing $file to Marketplace..."
            if ! .github/publish-tools/node_modules/.bin/vsce publish --packagePath "$file" --skip-duplicate; then
              echo "::warning::Marketplace publish failed for $file"
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish to Open VSX
        id: openvsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          failed=0
          for file in vsix/*.vsix; do
            echo "Publishing $file to Open VSX..."
            if ! .github/publish-tools/node_modules/.bin/ovsx publish "$file" --skip-duplicate; then
              echo "::warning::Open VSX publish failed for $file"
              failed=1
            fi
          done
          exit "$failed"
      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        # zizmor: ignore[superfluous-actions] keeps gh-release for generated notes + file upload UX
        with:
          generate_release_notes: true
          files: vsix/*.vsix
      - name: Publish summary
        if: ${{ !cancelled() }}
        env:
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
          OPENVSX_OUTCOME: ${{ steps.openvsx.outcome }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github-release.outcome }}
        run: |
          {
            echo "# FreeOCD Release Summary";
            echo "";
            echo "| Channel | Result |";
            echo "|---------|--------|";
            echo "| VS Code Marketplace | ${MARKETPLACE_OUTCOME} |";
            echo "| Open VSX | ${OPENVSX_OUTCOME} |";
            echo "| GitHub Release | ${GITHUB_RELEASE_OUTCOME} |";
            echo "";
            echo "## Artifacts";
            for f in vsix/*.vsix; do echo "- $(basename "$f")"; done;
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKETPLACE_OUTCOME" = "failure" ]; then
            echo "::warning::VS Code Marketplace publish failed"
          fi
          if [ "$OPENVSX_OUTCOME" = "failure" ]; then
            echo "::warning::Open VSX publish failed"
          fi
