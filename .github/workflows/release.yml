name: Release

on:
  push:
    tags: ['v*']
  # Dry-run: build and validate all VSIX targets on PRs that touch the release
  # inputs; only a tag push reaches the publish job.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - '.github/publish-tools/**'
      - '.vscodeignore*'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'vendor/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate tag and release policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test VSIX validator
        run: python3 .github/scripts/test_validate_vsix.py
      - name: Verify the tag matches package.json and main
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').packages[''].version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$lock" != "$version" ]]; then
            echo "::error::package.json version '$version' must be MAJOR.MINOR.PATCH and match package-lock.json ('$lock')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "Dry run for v$version"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit in main history"
            exit 1
          fi
      - name: Verify production requires approval and allows only v* tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/environments/production"
          gh api "$endpoint" | jq -e '
            .deployment_branch_policy.custom_branch_policies and
            any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))
          ' > /dev/null || { echo "::error::production must require a reviewer and use custom deployment policies"; exit 1; }
          gh api "$endpoint/deployment-branch-policies" | jq -e '
            any(.branch_policies[]; .name == "v*" and .type == "tag")
          ' > /dev/null || { echo "::error::production must allow the v* tag deployment policy"; exit 1; }

  lint-and-test:
    name: Release gate (lint + Linux test)
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install Linux system libs (for node-hid)
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Install deps
        run: npm ci
      - name: Build DAPjs
        run: npm run build:dapjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck (TypeScript 7)
        run: npm run typecheck
      - name: Validate target JSON files
        run: npm run lint:targets
      - name: Webpack build
        run: npm run compile
      - name: Run extension tests
        run: xvfb-run -a npm test

  build:
    name: Build VSIX (${{ matrix.target }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        # VSIX artifacts are built on the oldest supported runner images so
        # the bundled native bindings keep loading there (glibc / macOS floor).
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-24.04
            target: linux-armhf
            cross: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Set up QEMU (cross-build)
        if: matrix.cross
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Install Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Install deps
        run: npm ci
      - name: Build DAPjs
        run: npm run build:dapjs
      - name: Verify node-hid native binding
        if: '!matrix.cross'
        shell: bash
        run: |
          node -e "const h=require('node-hid'); console.log('node-hid loaded, HID devices count=', h.devices().length)"
      - name: Webpack build
        run: npm run compile
      - name: Install locked packaging tools
        run: npm ci --ignore-scripts --prefix .github/publish-tools
      - name: Package VSIX (${{ matrix.target }})
        shell: bash
        run: .github/publish-tools/node_modules/.bin/vsce package --target ${{ matrix.target }} --ignoreFile .vscodeignore-${{ matrix.target }} --out freeocd-extension-${{ matrix.target }}.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: freeocd-extension-${{ matrix.target }}.vsix
          if-no-files-found: error

  validate-vsix:
    name: Validate VSIX distribution
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
          digest-mismatch: error
      - name: Validate all seven targets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 .github/scripts/validate-vsix.py --version "$VERSION" --all vsix

  publish:
    name: Publish (Marketplace + Open VSX + GitHub Releases)
    needs: [validate, validate-vsix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - name: Install locked publishers
        run: npm ci --ignore-scripts --prefix .github/publish-tools
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
          digest-mismatch: error
      - name: Re-validate VSIX files
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 .github/scripts/validate-vsix.py --version "$VERSION" --all vsix
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: vsix/*.vsix
      - name: Publish to VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.AZURE_PAT }}
        run: |
          failed=0
          for file in vsix/*.vsix; do
            echo "Publishing $file to Marketplace..."
            if ! .github/publish-tools/node_modules/.bin/vsce publish --packagePath "$file" --skip-duplicate; then
              echo "::warning::Marketplace publish failed for $file"
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish to Open VSX
        id: openvsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          failed=0
          for file in vsix/*.vsix; do
            echo "Publishing $file to Open VSX..."
            if ! .github/publish-tools/node_modules/.bin/ovsx publish "$file" --skip-duplicate; then
              echo "::warning::Open VSX publish failed for $file"
              failed=1
            fi
          done
          exit "$failed"
      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        # zizmor: ignore[superfluous-actions] keeps gh-release for generated notes + file upload UX
        with:
          generate_release_notes: true
          files: vsix/*.vsix
      - name: Publish summary
        if: ${{ !cancelled() }}
        env:
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
          OPENVSX_OUTCOME: ${{ steps.openvsx.outcome }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github-release.outcome }}
        run: |
          {
            echo "# FreeOCD Release Summary";
            echo "";
            echo "| Channel | Result |";
            echo "|---------|--------|";
            echo "| VS Code Marketplace | ${MARKETPLACE_OUTCOME} |";
            echo "| Open VSX | ${OPENVSX_OUTCOME} |";
            echo "| GitHub Release | ${GITHUB_RELEASE_OUTCOME} |";
            echo "";
            echo "## Artifacts";
            echo '```';
            (cd vsix && sha256sum ./*.vsix);
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKETPLACE_OUTCOME" = "failure" ]; then
            echo "::warning::VS Code Marketplace publish failed"
          fi
          if [ "$OPENVSX_OUTCOME" = "failure" ]; then
            echo "::warning::Open VSX publish failed"
          fi
