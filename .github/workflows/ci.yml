name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + typecheck + target JSON
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Install deps
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck (TypeScript 7)
        run: npm run typecheck
      - name: Validate target JSON files
        run: npm run lint:targets

  build-and-test:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
      - name: Install Linux system libs (for node-hid)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - name: Install deps
        run: npm ci
      - name: Build DAPjs (vendor/dapjs)
        run: npm run build:dapjs
      - name: Verify node-hid native binding
        shell: bash
        run: |
          node -e "const h=require('node-hid'); console.log('node-hid loaded, HID devices count=', h.devices().length)"
      - name: Webpack build (production)
        run: npm run compile
      - name: Run extension tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run extension tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm test
