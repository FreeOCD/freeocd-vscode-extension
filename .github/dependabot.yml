version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    ignore:
      # Must stay pinned to the minimum VS Code API declared in engines.vscode.
      # Update manually only when engines.vscode is raised.
      - dependency-name: "@types/vscode"
      # Safeguard: never bump anything named "vscode". Note that Dependabot
      # only updates dependencies and never rewrites the engines field itself.
      - dependency-name: "vscode"
      # Must match the Node.js version of the VS Code extension host
      # (Node 22 for VS Code 1.102+). Allow minor/patch updates within 22.x.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # The classic `typescript` package must stay on 6.x: @typescript-eslint's
      # peer range is "<6.1.0". TS 7 coverage comes from @typescript/native
      # (tsgo) used by `npm run typecheck`. Re-evaluate when typescript-eslint
      # declares support for TypeScript 7. Note: typescript-estree >=8.73 also
      # declares an optional peer on @typescript/native via a floating
      # dated-nightly range; package.json overrides pin it to ^7.0.2 so new
      # nightlies cannot desync the lockfile for `npm ci`.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      devDependencies:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "webpack*"
          - "ts-loader"
          - "typescript"
  - package-ecosystem: npm
    directory: /.github/publish-tools
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    groups:
      publish-tools:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github_actions
